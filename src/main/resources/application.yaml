spring:
  application:
    name: crai
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/xe
    username: CRAI
    password: ${CRAI_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql : true

server:
  servlet:
    context-path: /crai
  port: 8082

storage:
  location: "images"

security:
  jwt:
    secret-key: ${CRAI_JWT_SECRET}
    expiration-time: 300000
