spring:
  application:
    name: crai
  datasource:
    # La IP del servidor Oracle cambia según la red: se pasa con CRAI_DB_URL.
    # Sin la variable, usa Oracle local.
    url: ${CRAI_DB_URL:jdbc:oracle:thin:@localhost:1521/xe}
    # Usuario de aplicación con mínimo privilegio (ADR-003). Nunca el dueño CRAI.
    username: US_CRAI
    password: ${CRAI_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      # El esquema solo cambia con scripts ejecutados como CRAI
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql : true

server:
  servlet:
    context-path: /crai
  port: 8082

storage:
  location: "images"

security:
  jwt:
    secret-key: ${CRAI_JWT_SECRET}
    expiration-time: 300000
